[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tara-embed"
version = "0.1.0"
description = "TARA: Text-Audio-Related-Annotation embedding model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

# NOTE: torch, torchvision, torchaudio, flash-attn, and xformers must be
# pre-installed separately with the correct CUDA build (e.g. cu121).
# See requirements.txt for the exact versions used during development.
dependencies = [
    "einops>=0.8.1",
    "Pillow>=10.0.0",
    "transformers==4.45.0",
    "sentencepiece>=0.2.0",
    "tokenizers>=0.20.0",
    "accelerate>=0.34.0",
    "huggingface-hub>=0.24.0",
    "qwen-vl-utils>=0.0.13",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "timm>=1.0.0",
    "decord>=0.6.0",
    "opencv-python-headless>=4.8.0",
    "moviepy>=2.0.0",
    "imageio>=2.31.0",
    "imageio-ffmpeg>=0.4.0",
    "bitsandbytes>=0.43.0",
    "pandas",
    "pyarrow",
    "func-timeout",
    "natsort",
    "termcolor",
    "tqdm",
    "PyYAML",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "datasets>=4.0.0",
    "IPython",
    "ipywidgets",
    "ffmpeg-python",
]

[tool.setuptools]
py-modules = ["modeling_tara", "modeling_tara_old"]

[tool.setuptools.packages.find]
include = ["tarsier2*", "shared*"]

[tool.setuptools.package-data]
tarsier2 = ["default_config.yaml"]
